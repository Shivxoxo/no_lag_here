<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ridge Rush">
  <!-- RIDGE RUSH app icon: sunset sky, twin ridges, a road over the crest and a jumping buggy wheel trail. Original artwork. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="0.55" stop-color="#6b2d6b"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ff0e4"/>
      <stop offset="1" stop-color="#128a85"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.5" stop-color="#ffab2e"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.6" stop-color="#ffcc33"/>
      <stop offset="1" stop-color="#ffcc33" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="352" cy="190" r="110" fill="url(#sun)"/>
    <circle cx="352" cy="190" r="58" fill="#ffd23f"/>
    <g fill="#ffffff" opacity="0.8">
      <circle cx="92" cy="92" r="4"/><circle cx="160" cy="60" r="3"/><circle cx="230" cy="110" r="2.5"/><circle cx="440" cy="70" r="3"/>
    </g>
    <path d="M-10 420 L120 230 L180 300 L260 180 L400 360 L440 320 L530 420 Z" fill="url(#far)" stroke="#0d1428" stroke-width="14" stroke-linejoin="round"/>
    <path d="M-20 520 L90 330 L160 400 L270 270 L390 430 L440 390 L540 520 Z" fill="url(#near)" stroke="#0d1428" stroke-width="16" stroke-linejoin="round"/>
    <path d="M226 318 L270 270 L316 330" fill="none" stroke="#fff6d8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 470 C120 380 190 470 270 380 S420 400 500 470" fill="none" stroke="#0d1428" stroke-width="12" stroke-dasharray="26 20" stroke-linecap="round"/>
    <!-- airborne wheel with motion arcs -->
    <g transform="translate(150 190) rotate(-18)">
      <path d="M-70 10 q30 -40 60 -18" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
      <path d="M-86 40 q30 -30 56 -12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
      <circle cx="18" cy="6" r="36" fill="#1d1f24" stroke="#0d1428" stroke-width="8"/>
      <circle cx="18" cy="6" r="16" fill="#d9dde3"/>
      <path d="M18 -26 V38 M-14 6 H50" stroke="#1d1f24" stroke-width="6"/>
      <circle cx="18" cy="6" r="6" fill="#ff7a1a"/>
    </g>
  </g>
</svg>
