  <meta name="description" content="RIDGE RUSH — Master the Mountains. A physics hill-climbing driving game: flip, collect coins, upgrade your ride and conquer eight wild worlds.">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>RIDGE RUSH — Master the Mountains</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
  <link rel="apple-touch-icon" href="assets/images/icon.svg">

<body class="booting">
  <!--
    Layer stack (bottom → top): game canvas · HUD · touch controls · UI screens · modals · toasts · boot splash.
    Screens, HUD and touch controls build their own markup (js/ui/screens.js, js/ui/hud.js, js/core/input.js);
    this file only provides the mount points and the shared SVG icon sprite used everywhere via <use href="#i-…">.
  -->
  <canvas id="game-canvas" aria-label="Ridge Rush game view"></canvas>
  <div id="hud" aria-hidden="true"></div>
  <div id="touch-controls" aria-hidden="true"></div>
  <main id="ui" aria-live="polite"></main>
  <div id="modal-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <div id="boot-splash" aria-hidden="true">
    <div class="splash-inner">
      <svg class="splash-glyph" viewBox="0 0 120 64" aria-hidden="true"><use href="#logo-ridge"></use></svg>
      <div class="splash-word">RIDGE RUSH</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">RIDGE RUSH needs JavaScript enabled to run.</div>
  </noscript>
