# Render.com blueprint — one web service with a persistent disk for SQLite.
services:
  - type: web
    name: sir-archives
    runtime: node
    plan: starter            # needs a paid plan for the persistent disk; free tier works without it (DB resets on deploy)
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/sir-archives.db
      - key: ADMIN_PASSWORD
        sync: false          # set in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: sir-data
      mountPath: /var/data
      sizeGB: 1
